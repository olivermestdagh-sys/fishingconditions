<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Olie's Kayak and Surf Fishing Conditions – Live</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body class="map-fullpage-body">

<header class="topbar">
  <h1>Olie's Kayak and Surf Fishing Conditions</h1>
  <div id="updated" class="updated">Loading…</div>
</header>

<nav class="tabnav">
  <a href="index.html">Week Ahead</a>
  <a href="conditions.html">Location</a>
  <a href="live.html" class="active">Live</a>
  <a href="locations.html">Settings</a>
</nav>

<main>
  <div id="liveMap" class="location-map-fullpage"></div>
  <div id="liveGpsStatus" class="live-gps-status">Finding your location…</div>

  <div id="liveHoverPanel" class="location-hover-panel" style="display:none;">
    <button id="btnCloseLiveHoverPanel" class="location-hover-panel-close" aria-label="Close">&times;</button>

    <section class="chart-section location-hover-panel-chart">
      <button type="button" id="liveHoverPanelBanner" class="live-hover-banner" aria-expanded="false">
        <div>
          <h2 id="liveHoverPanelLocationName">&nbsp;</h2>
          <p id="liveHoverPanelDistance" class="summary-sub" style="margin:0;"></p>
        </div>
        <span id="liveHoverPanelChevron" class="live-hover-chevron" aria-hidden="true">▾</span>
      </button>

      <div id="liveHoverPanelExpanded" style="display:none;">
        <div class="location-hover-panel-heading-row live-heading-row" style="padding-right:0;margin-top:10px;">
          <div id="liveSummaryCard" class="live-inline-stats" style="display:none;"></div>
          <div class="live-inline-timings">
            <label for="homeByTime">Home By</label>
            <input type="time" id="homeByTime" />
            <button id="btnUpdateTimings" class="btn-primary">Update</button>
          </div>
          <div class="graph-gesture-hint" aria-hidden="true">
            <div>Double-tap toggles full screen</div>
            <div>Hold for 2s to toggle data point</div>
          </div>
        </div>
        <p id="timingsStatus" class="footnote" style="margin:0 0 10px;text-align:left;"></p>

        <section id="typePickerSection" style="display:none;margin:0 0 12px;">
          <div id="typePicker" class="type-photo-row"></div>
        </section>

        <div id="liveChartFrame" class="live-chart-frame" style="margin-top:6px;">
          <div id="liveChartScroll" class="live-chart-scroll">
            <canvas id="liveChart"></canvas>
          </div>
        </div>
        <p id="liveHoverPanelEmptyState" class="empty-state" style="display:none;">No data yet for this location.</p>
      </div>
    </section>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="charts.js"></script>
<script src="live.js"></script>
</body>
</html>
