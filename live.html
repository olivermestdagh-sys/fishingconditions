<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Olie's Kayak and Surf Fishing Conditions – Live</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <h1>Olie's Kayak and Surf Fishing Conditions</h1>
  <div id="updated" class="updated">Loading…</div>
</header>

<nav class="tabnav">
  <a href="live.html" class="active">Live</a>
  <a href="index.html">Week ahead</a>
  <a href="conditions.html">Location</a>
  <a href="locations.html">Settings</a>
</nav>

<main>
  <section class="summary-card" id="gpsStatus">
    <div class="empty-state">Finding your location…</div>
  </section>

  <section class="picker-row" id="manualPickerRow" style="display:none;">
    <label for="manualLocationSelect">Not this spot?</label>
    <select id="manualLocationSelect"></select>
  </section>

  <section id="typePickerSection" style="display:none;">
    <div id="typePicker" class="type-photo-row"></div>
  </section>

  <section id="summaryCard" class="summary-card" style="display:none;">
    <!-- filled by live.js -->
  </section>

  <section class="summary-card" id="timingsSection">
    <label class="loc-edit-label" style="display:block;margin:0 0 10px;">Work out when to stop fishing</label>
    <div class="filter-row">
      <div>
        <label for="homeByTime">Home By</label>
        <input type="time" id="homeByTime" />
      </div>
      <div>
        <label for="homeAddress">Home address</label>
        <input type="text" id="homeAddress" placeholder="e.g. 12 Smith St, Melbourne VIC"
          style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--grey-200);" />
      </div>
    </div>
    <button id="btnUpdateTimings" class="btn-primary" style="margin-top:12px;">Update timings</button>
    <p id="timingsStatus" class="footnote" style="margin:10px 0 0;text-align:left;"></p>
  </section>

  <section class="chart-section full-width-chart" id="liveChartSection" style="display:none;">
    <h2>Last 24 hours &rarr; next 24 hours</h2>
    <canvas id="liveChart" height="220"></canvas>
    <p class="footnote" style="margin:4px 0 0;text-align:center;">Tap the graph for a bigger view</p>
  </section>

  <div id="chartModalOverlay" class="chart-modal-overlay" style="display:none;">
    <button id="btnCloseChartModal" class="chart-modal-close" aria-label="Close">&times;</button>
    <div class="chart-modal-inner">
      <canvas id="liveChartModal"></canvas>
    </div>
  </div>

  <footer class="footnote">
    Data from <a href="https://www.willyweather.com.au/" target="_blank" rel="noopener">WillyWeather</a>.
    Refreshed automatically every 30 minutes. Location matched to your device's GPS.
  </footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="charts.js"></script>
<script src="live.js"></script>
</body>
</html>
