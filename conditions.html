<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Olie's Kayak and Surf Fishing Conditions – Location</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

<header class="topbar">
  <h1>Olie's Kayak and Surf Fishing Conditions</h1>
  <div id="updated" class="updated">Loading…</div>
</header>

<nav class="tabnav">
  <a href="live.html">Live</a>
  <a href="index.html">Week (sessions)</a>
  <a href="week-new.html">Week (graphs)</a>
  <a href="conditions.html" class="active">Location</a>
  <a href="locations.html">Settings</a>
</nav>

<main>
  <section class="summary-card" style="padding:10px;">
    <div id="locationMap" class="location-map"></div>
    <p class="footnote" style="margin:8px 4px 0;text-align:left;">Tap a marker to select that location — or use the dropdown below.</p>
  </section>

  <section class="picker-row">
    <label for="locationSelect">Location</label>
    <select id="locationSelect"></select>
  </section>

  <section id="summaryCard" class="summary-card">
    <!-- filled by app.js -->
  </section>

  <section class="chart-section full-width-chart">
    <h2>Conditions Graph</h2>
    <canvas id="conditionsChart" height="220"></canvas>
    <p class="footnote" style="margin:4px 0 0;text-align:center;">Tap the graph for a bigger view</p>
  </section>

  <div id="chartModalOverlay" class="chart-modal-overlay" style="display:none;">
    <button id="btnCloseChartModal" class="chart-modal-close" aria-label="Close">&times;</button>
    <div class="chart-modal-inner">
      <canvas id="conditionsChartModal"></canvas>
    </div>
  </div>

  <footer class="footnote">
    Data from <a href="https://www.willyweather.com.au/" target="_blank" rel="noopener">WillyWeather</a>.
    Refreshed automatically every 30 minutes.
  </footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
