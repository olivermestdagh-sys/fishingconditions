<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Olie's Kayak and Surf Fishing Conditions – Location</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body class="map-fullpage-body">

<header class="topbar">
  <h1>Olie's Kayak and Surf Fishing Conditions</h1>
  <div id="updated" class="updated">Loading…</div>
</header>

<nav class="tabnav">
  <a href="live.html">Live</a>
  <a href="index.html">Week (sessions)</a>
  <a href="week-new.html">Week (graphs)</a>
  <a href="conditions.html" class="active">Location</a>
  <a href="locations.html">Settings</a>
</nav>

<main>
  <div id="locationMap" class="location-map-fullpage"></div>

  <div id="locationHoverPanel" class="location-hover-panel" style="display:none;">
    <button id="btnCloseHoverPanel" class="location-hover-panel-close" aria-label="Close">&times;</button>

    <section class="chart-section location-hover-panel-chart">
      <h2 id="hoverPanelLocationName">&nbsp;</h2>
      <p class="footnote" style="margin:0 0 8px;text-align:center;">Tap the graph for a bigger view</p>
      <div class="location-hover-panel-chart-wrap">
        <canvas id="conditionsChart"></canvas>
      </div>
      <p id="hoverPanelEmptyState" class="empty-state" style="display:none;">No data yet for this location. It'll appear after the next scheduled update.</p>
    </section>
  </div>

  <div id="chartModalOverlay" class="chart-modal-overlay" style="display:none;">
    <button id="btnCloseChartModal" class="chart-modal-close" aria-label="Close">&times;</button>
    <div class="chart-modal-inner">
      <canvas id="conditionsChartModal"></canvas>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
