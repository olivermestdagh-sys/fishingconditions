name = "fishingconditions-users"
main = "user-backend.js"
compatibility_date = "2026-09-12"
workers_dev = true
preview_urls = false
# Also served from a custom domain (Cloudflare creates the DNS record + certificate on deploy: the zone is in this
# account). workers_dev stays true so the old workers.dev address keeps working during the move.
routes = [{ pattern = "api.yepyepyep.app", custom_domain = true }]

[observability]
enabled = true

# Hourly: fills the weather / tide of trip-log rows from the D1 archive (user-backend.js scheduled -> conditionsBackfill).
[triggers]
crons = ["20 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "fishingconditions-users"
database_id = "bf81bd8d-85ba-4532-a00e-c2ba3d480619"

# CUTOVER (pipeline stage 5), not yet: bind the scheduled pipeline Worker so "Refresh data now" runs it directly (user-backend.js
# refreshViaPipeline) instead of dispatching the GitHub workflow. Deploying with this uncommented BEFORE fishingconditions-pipeline
# exists fails the deploy, so it stays commented until then.
# [[services]]
# binding = "PIPELINE"
# service = "fishingconditions-pipeline"

[vars]
ALLOWED_ORIGIN = "https://olivermestdagh-sys.github.io,https://yepyepyep.app"
FRONTEND_ACCOUNT_URL = "https://olivermestdagh-sys.github.io/fishingconditions/locations.html"
GH_REPO_NAME = "fishingconditions"
GH_REPO_OWNER = "olivermestdagh-sys"
GH_WORKFLOW_FILE = "update.yml"
GOOGLE_CLIENT_ID = "980249471001-mspp2fvr1ovomu1068u9o2nvvr6tam3e.apps.googleusercontent.com"
# One per address the Worker answers on; the one used is the one on the host the sign-in started on (resolveRedirectUri).
GOOGLE_REDIRECT_URI = "https://api.yepyepyep.app/auth/callback,https://fishingconditions-users.olies-fishing.workers.dev/auth/callback"

# Secrets (not stored here; already set on the deployed worker, kept on deploy):
#   GH_ACTIONS_TOKEN, GOOGLE_CLIENT_SECRET, PIPELINE_API_TOKEN

