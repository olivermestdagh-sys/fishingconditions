# TEMPORARY (delete after one run): checks COMPASS_TIE_RESULTS against the ORIGINAL float formula on a real GitHub ubuntu runner.
# Prints/annotates ONLY compass names and the Python / glibc versions. Runs on a push of this file to its branch; changes nothing.
name: tmp-compass-check
on:
  push:
    branches: [deterministic-wind-tie-and-means]
    paths: [".github/workflows/tmp-compass-check.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Original formula vs the committed table (both reading orders)
        run: |
          python3 - <<'PY'
          import ast, math, platform, re, subprocess, sys
          D = {"N": 0, "NNE": 22.5, "NE": 45, "ENE": 67.5, "E": 90, "ESE": 112.5, "SE": 135, "SSE": 157.5,
               "S": 180, "SSW": 202.5, "SW": 225, "WSW": 247.5, "W": 270, "WNW": 292.5, "NW": 315, "NNW": 337.5}
          names = list(D)
          def old(a, b):
              r1, r2 = math.radians(D[a]), math.radians(D[b])
              x = (math.cos(r1) + math.cos(r2)) / 2
              y = (math.sin(r1) + math.sin(r2)) / 2
              deg = math.degrees(math.atan2(y, x)) % 360
              return min(names, key=lambda n: min(abs(D[n] - deg), 360 - abs(D[n] - deg)))
          src = open("scripts/fetch_conditions.py", encoding="utf-8").read()
          table = ast.literal_eval(re.search(r"COMPASS_TIE_RESULTS = (\{.*?\n\})", src, re.S).group(1))
          bad = [f"{x}|{y}: original formula gives {old(x, y)}, table says {want}" for (a, b), want in table.items() for x, y in ((a, b), (b, a)) if old(x, y) != want]
          glibc = subprocess.run(["ldd", "--version"], capture_output=True, text=True).stdout.splitlines()[0]
          # also: even-step pairs must land on the exact middle (the rule the code uses for them)
          odd = {(min(names.index(a), names.index(b)), max(names.index(a), names.index(b))) for (a, b) in table}
          mid_bad = []
          for i in range(16):
              for j in range(i + 1, 16):
                  gap = min(j - i, 16 - (j - i))
                  if gap % 2 == 0 and gap != 8:
                      step = (j - i + 8) % 16 - 8
                      if old(names[i], names[j]) != names[(i + step // 2) % 16]:
                          mid_bad.append(f"{names[i]}|{names[j]}")
          summary = f"python {platform.python_version()} | {glibc} | table entries {len(table)} | disagreements {len(bad)} | even-step disagreements {len(mid_bad)}"
          print(summary)
          print(f"::notice title=compass-check::{summary}")
          for line in bad + mid_bad:
              print(f"::error title=compass-check disagreement::{line}")
          sys.exit(1 if (bad or mid_bad) else 0)
          PY
