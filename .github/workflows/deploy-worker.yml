name: Deploy worker

# Deploys user-backend.js (the Cloudflare Worker) when it or wrangler.toml
# changes on main, or on demand from the Actions tab. Needs two repository
# secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   - an API token with "Edit Cloudflare Workers" (and D1 edit) permission
#   CLOUDFLARE_ACCOUNT_ID  - 04bef234d0653dedc8d35edd087b244d
# Until both are set the deploy step is skipped (with a notice), not failed.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - user-backend.js
      - wrangler.toml

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Deploy with wrangler
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets not set - skipping deploy."
            exit 0
          fi
          npx --yes wrangler@4 deploy
