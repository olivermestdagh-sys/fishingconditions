name: Update conditions data

on:
  schedule:
    # Every 3 hours by default — WillyWeather bills per API request after your free allowance,
    # and each run costs 2 requests x however many locations you have. See README.md for the
    # cost math before making this more frequent (e.g. every 30 min).
    - cron: "0 */3 * * *"
  workflow_dispatch: {}   # adds a manual "Run workflow" button in the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the refreshed data file back to the repo

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch latest conditions
        env:
          WILLYWEATHER_API_KEY: ${{ secrets.WILLYWEATHER_API_KEY }}
          # Locations now live in D1 behind the user-backend Worker (Public
          # account's own rows) rather than config/locations.json — see
          # fetch_conditions.py's own updated header comment and
          # user-backend.js's "Pipeline" section. PIPELINE_API_TOKEN is a
          # long-lived shared secret, NOT the same kind of credential as
          # anything session/cookie-based the site's own sign-in uses.
          PIPELINE_WORKER_URL: ${{ secrets.PIPELINE_WORKER_URL }}
          PIPELINE_API_TOKEN: ${{ secrets.PIPELINE_API_TOKEN }}
          FORECAST_DAYS: "6"
        run: python3 scripts/fetch_conditions.py

      - name: Commit updated data file
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update conditions data"
          # config/locations.json IS committed again here — it's no longer
          # the SOURCE for fetch_conditions.py (that's D1 now, via the
          # pipeline endpoint above), but it's regenerated every run as an
          # EXPORT (see export_locations_json(), fetch_conditions.py) so
          # charts.js's own direct client-side reads of this file (Live
          # page GPS-matching, tide-offset lookups, boat-ramp-access chart
          # threshold) keep working without needing any changes there.
          file_pattern: "data/conditions.json config/locations.json"
