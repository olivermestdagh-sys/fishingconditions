name: Update conditions data

on:
  schedule:
    # Every 3 hours by default — WillyWeather bills per API request after your free allowance,
    # and each run costs 2 requests x however many locations you have. See README.md for the
    # cost math before making this more frequent (e.g. every 30 min).
    - cron: "0 */3 * * *"
  workflow_dispatch: {}   # adds a manual "Run workflow" button in the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the refreshed data file back to the repo

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch latest conditions
        env:
          WILLYWEATHER_API_KEY: ${{ secrets.WILLYWEATHER_API_KEY }}
          # Locations now live in D1 behind the user-backend Worker (Public
          # account's own rows) rather than config/locations.json — see
          # fetch_conditions.py's own updated header comment and
          # user-backend.js's "Pipeline" section. PIPELINE_API_TOKEN is a
          # long-lived shared secret, NOT the same kind of credential as
          # anything session/cookie-based the site's own sign-in uses.
          PIPELINE_WORKER_URL: ${{ secrets.PIPELINE_WORKER_URL }}
          PIPELINE_API_TOKEN: ${{ secrets.PIPELINE_API_TOKEN }}
          FORECAST_DAYS: "6"
          # Observed-conditions archive retention (see scripts/observation_archive.py): "dry" only reports
          # how many old rows would be deleted; change to "run" to actually delete rows older than 30 days
          # that aren't within 12 hours of a session; "off" skips the step.
          OBS_PRUNE: "dry"
        run: |
          # record_run.py runs fetch_conditions.py itself (with its clock pinned to the start of the run) and records the run for the shadow
          # Worker (pipeline/). It must never cost a data run: if it exits nonzero, run the original script exactly as before.
          if ! python3 scripts/record_run.py; then
            echo "::warning::scripts/record_run.py failed - falling back to the plain python3 scripts/fetch_conditions.py"
            python3 scripts/fetch_conditions.py
          fi

      - name: Upload the recording to the private shadow bucket (best effort)
        # A recording problem never fails the workflow: this step may fail, be skipped or be missing its secrets and the data run stands.
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_SHADOW_BUCKET: fishingconditions-shadow-private
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "R2 secrets are not set: skipping the recording upload"
            exit 0
          fi
          shopt -s nullglob
          for f in recordings/*.json; do
            # The recording holds private locations: it goes ONLY to the private bucket (never an artifact, never git).
            curl --fail-with-body -sS --max-time 180 --aws-sigv4 "aws:amz:auto:s3" --user "$R2_ACCESS_KEY_ID:$R2_SECRET_ACCESS_KEY" \
              -H "x-amz-content-sha256: UNSIGNED-PAYLOAD" -T "$f" \
              "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com/$R2_SHADOW_BUCKET/recordings/$(basename "$f")" && echo "uploaded $(basename "$f")"
          done

      - name: Commit updated data file
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update conditions data"
          # config/locations.json IS committed again here — it's no longer
          # the SOURCE for fetch_conditions.py (that's D1 now, via the
          # pipeline endpoint above), but it's regenerated every run as an
          # EXPORT (see export_locations_json(), fetch_conditions.py) so
          # charts.js's own direct client-side reads of this file (Live
          # page GPS-matching, tide-offset lookups, boat-ramp-access chart
          # threshold) keep working without needing any changes there.
          file_pattern: "data/conditions.json data/graph config/locations.json"
