name: Update conditions data

on:
  schedule:
    # Every 3 hours by default — WillyWeather bills per API request after your free allowance,
    # and each run costs 2 requests x however many locations you have. See README.md for the
    # cost math before making this more frequent (e.g. every 30 min).
    - cron: "0 */3 * * *"
  workflow_dispatch: {}   # adds a manual "Run workflow" button in the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the refreshed data file back to the repo

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch latest conditions
        env:
          WILLYWEATHER_API_KEY: ${{ secrets.WILLYWEATHER_API_KEY }}
          FORECAST_DAYS: "6"
        run: python3 scripts/fetch_conditions.py

      - name: Commit updated data file
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update conditions data"
          # config/locations.json is now ALSO written by fetch_conditions.py
          # (see the WillyWeather id/name/region/state caching comment at
          # the top of process_location(), fetch_conditions.py) — each
          # location's resolved WillyWeather id gets written back here so
          # every future run can skip search entirely for it. Committing it
          # alongside data/conditions.json is what makes that cache actually
          # persist between runs, instead of being rediscovered and thrown
          # away every single time.
          file_pattern: "data/conditions.json config/locations.json"
