name: Classify tide types (one-off)

# Manual-only — no schedule. This exists purely to run
# scripts/classify_tide_types.py once (or a few times, if you need to
# re-run it) without needing Python installed locally. Safe to delete
# this file once you're done with it; it doesn't touch anything else on
# the site.

on:
  workflow_dispatch: {}

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run classification
        env:
          WILLYWEATHER_API_KEY: ${{ secrets.WILLYWEATHER_API_KEY }}
        run: python3 scripts/classify_tide_types.py
